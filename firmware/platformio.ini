[platformio]
description = Dualpanto firmware

[protocol]
base_dir = ../utils/protocol
include_dir = ${protocol.base_dir}/include
src_dir = ${protocol.base_dir}/src
src_filter = +<../${protocol.src_dir}>

[env:esp32dev]
platform = espressif32@2.1.0
framework = arduino
board = esp32dev
build_flags =
    -I${protocol.include_dir}
    -D_GLIBCXX_USE_C99
    -DENABLE_FPS
    -g
    -frtti
    -mtext-section-literals
    #-DENABLE_CRASHDUMP
    #-DENABLE_PERFMON
    # use this while debugging
    # -Og -ggdb
build_unflags =
    # use this while debugging
    # -Os
src_filter =
    +<*>
    ${protocol.src_filter}
monitor_speed = 115200
lib_deps =
    https://github.com/PaulStoffregen/Encoder.git
    tomstewart89/BasicLinearAlgebra@^3.2

# On OSX on some machines you need to use the following USB port.
# If this doesn't work, comment it out and try again.
# You can also find all available ports with `pio device list`
# or in the "Devices" tab in PlatformIO Home.
# On Windows comment out this line‚
upload_port = /dev/cu.SLAB_USBtoUART
